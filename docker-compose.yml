services:
  db:
    image: postgres:16-alpine
    container_name: sosqr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sosqr_api_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sosqr-network

  api:
    build:
      context: ./backend/sosqr-api
      dockerfile: Dockerfile
    container_name: sosqr-api
    restart: unless-stopped
    command: bin/rails server -b 0.0.0.0
    volumes:
      - ./backend/sosqr-api:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sosqr-network
    env_file:
      - ./backend/sosqr-api/.env

  web:
    build:
      context: ./frontend/sosqr-web
      dockerfile: Dockerfile
    container_name: sosqr-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/sosqr-web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:3000/api/v1
    depends_on:
      - api
    networks:
      - sosqr-network
    env_file:
      - ./frontend/sosqr-web/.env

volumes:
  postgres_data:
  bundle_cache:

networks:
  sosqr-network:
    driver: bridge